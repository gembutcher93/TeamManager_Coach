<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#060A18">
    <meta name="robots" content="noindex">
    <title>AiRIM Società</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Urbanist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
    /* stessi colori e stessi componenti del Coach (index.html) */
    :root{
        --ink:#060A18; --surface:#0E1525; --surface-2:#141D31; --surface-3:#1B2740;
        --line:#22304E; --line-soft:#1A2238;
        --brand:#22C55E; --brand-glow:rgba(34,197,94,.30);
        --flame:#F0463C; --gold:#F5B301;
        --text:#F3F7FC; --muted:#8395B4; --muted-2:#5C6C8C;
        --radius:16px; --shadow:0 18px 40px -18px rgba(0,0,0,.7);
        --ok:#22C55E; --warn:#F5B301; --bad:#F0463C;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Urbanist',system-ui,sans-serif;}
    body{background:var(--ink);color:var(--text);min-height:100vh;overflow-x:hidden;
        background-image:radial-gradient(1200px 600px at 80% -10%, rgba(34,197,94,.07), transparent 60%);}
    h1,h2,h3,.num{font-family:'Outfit',sans-serif;}
    .num{font-variant-numeric:tabular-nums;}
    a{color:inherit;}
    [hidden]{display:none!important;}
    main{max-width:760px;margin:0 auto;padding:calc(1rem + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));}

    .top{display:flex;align-items:center;gap:12px;margin-bottom:1.2rem;}
    .top img{width:42px;height:42px;border-radius:12px;box-shadow:0 0 0 1px rgba(34,197,94,.28);}
    .top .t{flex:1;min-width:0;}
    .top .t b{display:block;font-family:'Outfit';font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .top .t span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;}
    .eyebrow{font-size:.7rem;letter-spacing:3px;text-transform:uppercase;color:var(--brand);font-weight:700;}
    h2{font-size:1.5rem;font-weight:800;margin:.2rem 0 1rem;}
    .sub{color:var(--muted);font-size:.92rem;margin:-.6rem 0 1rem;}

    .card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:1.1rem;margin-bottom:1rem;box-shadow:var(--shadow);}
    .card h3{font-size:1rem;font-weight:700;margin-bottom:.8rem;display:flex;align-items:center;gap:8px;}
    .card h3 i{color:var(--brand);}
    .hint{font-size:.82rem;color:var(--muted-2);margin-top:.6rem;line-height:1.4;}
    .muted{color:var(--muted);}

    .fg{display:flex;flex-direction:column;gap:6px;margin-bottom:.8rem;flex:1;min-width:120px;}
    .row{display:flex;gap:10px;flex-wrap:wrap;}
    .fg label{font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;}
    .fg input,.fg select,.fg textarea{background:var(--surface-2);border:1px solid var(--line);color:var(--text);
        padding:12px;border-radius:10px;font-size:1rem;font-weight:500;width:100%;}
    .fg textarea{min-height:110px;resize:vertical;font-size:.92rem;}
    .fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-glow);}
    .check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;margin:.4rem 0 .9rem;cursor:pointer;}
    .check input{width:20px;height:20px;accent-color:var(--brand);flex:0 0 auto;margin-top:1px;}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;text-decoration:none;
        font-weight:700;font-size:.95rem;padding:12px 16px;border-radius:10px;min-height:44px;transition:.18s;}
    .btn:disabled{opacity:.5;cursor:default;}
    .btn-accent{background:var(--brand);color:#04140A;}
    .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
    .btn-danger{background:var(--flame);color:#fff;}
    .btn-sm{padding:7px 11px;font-size:.85rem;min-height:36px;}
    .btn-block{width:100%;}
    .btns{display:flex;gap:8px;flex-wrap:wrap;}
    .btns .btn{flex:1;}

    .tabs{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;margin-bottom:1rem;}
    .tabs button{flex:1;background:none;border:none;color:var(--muted);font-weight:700;padding:10px;border-radius:9px;cursor:pointer;font-size:.92rem;}
    .tabs button.on{background:var(--surface-3);color:var(--text);}

    .list{display:flex;flex-direction:column;gap:8px;}
    .item{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:12px;cursor:pointer;width:100%;text-align:left;color:inherit;font-size:inherit;}
    .item .b{flex:1;min-width:0;}
    .item .b b{display:block;}
    .item .b small{color:var(--muted);font-size:.82rem;}
    .item .r{text-align:right;font-weight:700;}
    .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;background:var(--muted-2);}
    .dot.ok{background:var(--ok);} .dot.warn{background:var(--warn);} .dot.bad{background:var(--bad);}
    .badge{display:inline-block;font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;}
    .badge.ok{background:rgba(34,197,94,.15);color:var(--ok);} .badge.warn{background:rgba(245,179,1,.15);color:var(--warn);}
    .badge.bad{background:rgba(240,70,60,.15);color:var(--bad);} .badge.off{background:var(--surface-3);color:var(--muted);}
    .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1rem;}
    .kpi{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:12px;}
    .kpi span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;}
    .kpi b{display:block;font-family:'Outfit';font-size:1.45rem;margin-top:2px;}
    .empty{color:var(--muted);text-align:center;padding:1.4rem .6rem;font-size:.92rem;}
    .back{background:none;border:none;color:var(--muted);font-weight:700;cursor:pointer;padding:6px 0;margin-bottom:.4rem;font-size:.92rem;}
    .policy{max-height:220px;overflow:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;
        font-size:.8rem;line-height:1.5;white-space:pre-wrap;color:var(--muted);margin-bottom:.6rem;}
    .secret{font-family:'Outfit';font-size:1.6rem;letter-spacing:2px;background:var(--surface-2);border:1px dashed var(--brand);border-radius:12px;padding:12px;text-align:center;margin:.4rem 0 .8rem;}

    nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;
        background:rgba(6,10,24,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line-soft);padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
    nav.bottom .in{display:flex;max-width:760px;width:100%;}
    nav.bottom button{flex:1;background:none;border:none;color:var(--muted-2);display:flex;flex-direction:column;align-items:center;gap:3px;
        font-size:.66rem;font-weight:700;padding:6px 2px;cursor:pointer;min-width:0;}
    nav.bottom button i{font-size:1.1rem;}
    nav.bottom button.on{color:var(--brand);}

    #sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;}
    #sheet.show{display:flex;}
    #sheet .box{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;
        max-height:92vh;overflow:auto;padding:1.1rem 16px calc(1.1rem + env(safe-area-inset-bottom));}
    #sheet .box h3{font-size:1.1rem;margin-bottom:.9rem;}
    @media (min-width:700px){ #sheet{align-items:center;} #sheet .box{border-radius:18px;} }

    #toast-stack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:99;
        display:flex;flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:480px;pointer-events:none;}
    .toast{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:12px;padding:12px 14px;
        font-weight:600;font-size:.9rem;box-shadow:var(--shadow);}
    .toast.danger{border-left-color:var(--bad);} .toast.info{border-left-color:var(--muted);}
    .loading{text-align:center;color:var(--muted);padding:3rem 0;}
    </style>
</head>
<body>
<main id="app"><div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Caricamento…</div></main>
<nav class="bottom" id="nav" hidden><div class="in" id="nav-in"></div></nav>
<div id="sheet"><div class="box" id="sheet-box"></div></div>
<div id="toast-stack"></div>
<script src="societa.js"></script>
</body>
</html>
